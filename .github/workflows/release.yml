name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.1.0). Leave empty to use the pushed tag."
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1). ci.yml passes the auto-bumped tag after a successful production deploy."
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            server: pi-host-ops-server-linux-x64
            worker: worker-linux-x64
            host_ops: host-ops-linux-x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            server: pi-host-ops-server-windows-x64.exe
            worker: worker-windows-x64.exe
            host_ops: host-ops-windows-x64.exe
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            server: pi-host-ops-server-linux-arm64
            worker: worker-linux-arm64
            host_ops: host-ops-linux-arm64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15
            archive: tar.gz
            server: pi-host-ops-server-darwin-x64
            worker: worker-darwin-x64
            host_ops: host-ops-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
            server: pi-host-ops-server-darwin-arm64
            worker: worker-darwin-arm64
            host_ops: host-ops-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (linux aarch64)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Stamp crate version from tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"; else TAG="${{ github.ref_name }}"; fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to stamp non-semver tag: $TAG" >&2; exit 1 ;;
          esac
          VER="${TAG#v}"
          PY="$(command -v python3 || command -v python)"
          "$PY" - "$VER" <<'EOF'
          import re, sys
          ver = sys.argv[1]
          lines = open('Cargo.toml').read().splitlines(keepends=True)
          out, in_pkg, done = [], False, False
          for ln in lines:
              if ln.startswith('['):
                  in_pkg = ln.strip() == '[package]'
              if in_pkg and not done and re.match(r'^version\s*=', ln):
                  ln = f'version = "{ver}"\n'
                  done = True
              out.append(ln)
          assert done, 'no [package] version found'
          open('Cargo.toml', 'w').write(''.join(out))
          lock = open('Cargo.lock').read()
          new, cnt = re.subn(r'(name = "pi-host-ops-server"\nversion = ")[^"]*(")', lambda m: m.group(1) + ver + m.group(2), lock)
          assert cnt == 1, f'expected 1 lock stanza, got {cnt}'
          open('Cargo.lock', 'w').write(new)
          print(f'stamped crate version {ver}')
          EOF

      - name: Build (native)
        if: matrix.cross != true
        run: cargo build --locked --release --target ${{ matrix.target }} --bins

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --locked --release --target ${{ matrix.target }} --bins

      - name: Stage binaries (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release"
          cp "$SRC/pi-host-ops-server" "dist/${{ matrix.server }}"
          cp "$SRC/worker" "dist/${{ matrix.worker }}"
          cp "$SRC/host-ops" "dist/${{ matrix.host_ops }}"
          chmod +x "dist/${{ matrix.server }}" "dist/${{ matrix.worker }}" "dist/${{ matrix.host_ops }}"
          # macOS runners lack sha256sum; shasum output format is compatible.
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.server }}" "${{ matrix.worker }}" "${{ matrix.host_ops }}" > SHA256SUMS-${{ matrix.target }}.txt)
          else
            (cd dist && shasum -a 256 "${{ matrix.server }}" "${{ matrix.worker }}" "${{ matrix.host_ops }}" > SHA256SUMS-${{ matrix.target }}.txt)
          fi
          ls -la dist

      - name: Stage binaries (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = "target/${{ matrix.target }}/release"
          Copy-Item "$src/pi-host-ops-server.exe" "dist/${{ matrix.server }}"
          Copy-Item "$src/worker.exe" "dist/${{ matrix.worker }}"
          Copy-Item "$src/host-ops.exe" "dist/${{ matrix.host_ops }}"
          $hashes = @()
          foreach ($f in @("${{ matrix.server }}", "${{ matrix.worker }}", "${{ matrix.host_ops }}")) {
            $h = (Get-FileHash -Algorithm SHA256 "dist/$f").Hash.ToLower()
            $hashes += "$h  $f"
          }
          $hashes | Set-Content -Encoding ascii "dist/SHA256SUMS-${{ matrix.target }}.txt"
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            echo "No tag: push a v* tag or pass tag input (workflow_dispatch / workflow_call)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: Collect assets + combined SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -print
          # download-artifact with merge-multiple puts files flat or nested; normalize
          find artifacts -type f \( -name 'worker-*' -o -name 'pi-host-ops-server-*' -o -name 'host-ops-*' -o -name 'SHA256SUMS-*' \) \
            -exec cp -v {} release-assets/ \;
          cd release-assets
          cat SHA256SUMS-*.txt | sort > SHA256SUMS
          ls -la
          cat SHA256SUMS

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          generate_release_notes: true
          body: |
            ## Binaries

            Download the asset for your OS (no cargo required on the target machine).

            | Asset | Platform |
            |-------|----------|
            | `worker-linux-x64` | Linux x86_64 worker |
            | `worker-windows-x64.exe` | Windows x86_64 worker |
            | `worker-linux-arm64` | Linux aarch64 worker |
            | `worker-darwin-x64` / `worker-darwin-arm64` | macOS |
            | `host-ops-*` | Dispatcher CLI (same platforms) |
            | `pi-host-ops-server-*` | Server binaries (same platforms) |
            | `SHA256SUMS` | Checksums |

            ### Install worker (Windows)

            ```powershell
            powershell -ExecutionPolicy Bypass -File scripts\install-worker.ps1 -Repo ModerRAS/pi-host-ops-server -Version ${{ steps.tag.outputs.tag }} -AgentToken '<token>' -HostOpsUrl 'https://your-server:8787' -Run
            ```

            Or after cloning this repo at the release tag, run the script from `scripts/`.

            ### Install worker (Linux)

            ```bash
            ./scripts/install-worker.sh --repo ModerRAS/pi-host-ops-server --version ${{ steps.tag.outputs.tag }} \
              --agent-token '<token>' --host-ops-url 'https://your-server:8787' --run
            ```

            ### Install dispatcher CLI (host-ops)

            ```bash
            ./scripts/install-host-ops.sh --repo ModerRAS/pi-host-ops-server --version ${{ steps.tag.outputs.tag }}
            host-ops config set --url 'https://your-server:8787' --token '<DISPATCHER_TOKEN>'
            ```

            Releases are auto-published after each successful production deploy
            (`v<next-patch>` at the deployed commit, marked latest); manual
            `workflow_dispatch` with a `tag` input still works.
          files: |
            release-assets/worker-*
            release-assets/host-ops-*
            release-assets/pi-host-ops-server-*
            release-assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
