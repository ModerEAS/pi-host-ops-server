name: CI

# PR: run tests + build image (no push to GHCR).
# master / v* tag: run tests, then build and push to ghcr.io/moderras/pi-host-ops-server.
# NOTE: image name must stay lowercase (moderras, not ModerRAS).
# Worker is NOT containerized (needs host pi binary / project dirs); only the
# dispatcher server (Axum + SQLite) ships as an image.
on:
  push:
    branches: [master, main, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  IMAGE: ghcr.io/moderras/pi-host-ops-server

jobs:
  version:
    name: resolve next release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: find the latest vX.Y.Z release tag.
          fetch-depth: 0
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VER="$(awk 'BEGIN{p=0} /^\[package\]/{p=1; next} /^\[/{p=0} p && /^version[[:space:]]*=/ {gsub(/^[^"]*"/,""); gsub(/".*/,""); print; exit}' Cargo.toml)"
          NEXT="$(python3 - "$CARGO_VER" <<'EOF'
          import re, subprocess, sys
          cargo = sys.argv[1]
          assert re.fullmatch(r'\d+\.\d+\.\d+', cargo), f"bad Cargo [package] version {cargo!r}"
          out = subprocess.run(['git', 'tag', '--list', 'v*'], capture_output=True, text=True, check=True).stdout
          tags = [t[1:] for t in out.split() if re.fullmatch(r'v\d+\.\d+\.\d+', t)]
          key = lambda s: tuple(int(x) for x in s.split('.'))
          latest = max(tags, key=key) if tags else None
          if latest is None or key(cargo) > key(latest):
              nxt = cargo  # no tags yet, or manual minor/major bump in Cargo.toml
          else:
              m = list(key(latest)); m[2] += 1
              nxt = '.'.join(map(str, m))
          print(nxt)
          EOF
          )"
          echo "cargo=${CARGO_VER} next=${NEXT}"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: cargo build --release
        run: cargo build --locked --release --bins

  image:
    name: build image (push only on master / v*)
    runs-on: ubuntu-latest
    needs: [test, version]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: validate compose config
        run: docker compose config -q
      - name: login GHCR
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # master push: sha-<commit> for immutable Swarm deploys, latest tracks stable.
            type=raw,value=sha-${{ github.sha }},enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            # master push: also tag the upcoming release version (resolved by the version job).
            type=raw,value=${{ needs.version.outputs.tag }},enable=${{ github.ref == 'refs/heads/master' }}
      - name: build (push only on master / v*)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test image health endpoint
        run: |
          set -euo pipefail
          docker buildx build --load -t host-ops-smoke:ci --cache-from type=gha .
          docker run -d --name host-ops-smoke -p 8787:8787 \
            -e DISPATCHER_TOKEN=ci-smoke -e AGENT_TOKEN=ci-smoke-agent \
            host-ops-smoke:ci
          cleanup() { docker logs host-ops-smoke 2>/dev/null || true; docker rm -f host-ops-smoke >/dev/null 2>&1 || true; }
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/health; then
              echo; echo HEALTHY
              break
            fi
            sleep 3
          done
          if ! curl -fsS http://127.0.0.1:8787/health | grep -q '"ok":true'; then
            echo "smoke FAILED — container logs:"
            cleanup
            exit 1
          fi
          cleanup

  deploy:
    name: deploy to Swarm (production)
    runs-on: ubuntu-latest
    needs: [image, binaries]
    # Main repo master push only; forks and PRs never deploy. Server is never
    # built on the manager — pull GHCR + `docker stack deploy` only.
    if: github.repository == 'ModerRAS/pi-host-ops-server' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    env:
      # Must match the image job's `sha-<commit>` tag.
      IMAGE_TAG: sha-${{ github.sha }}
      HOST_OPS_DOMAIN: ${{ vars.HOST_OPS_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: setup SSH (key + known_hosts, strict host check)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: sync stack file to manager
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SSH() { ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$@"; }
          SSH "mkdir -p '${DEPLOY_PATH}'"
          scp -i ~/.ssh/id_deploy -P "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes \
            deploy/stack.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
      - name: create missing Swarm secrets (dispatcher + optional webhook)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DISPATCHER_TOKEN: ${{ secrets.DISPATCHER_TOKEN }}
          HOST_OPS_WEBHOOK_URL: ${{ secrets.HOST_OPS_WEBHOOK_URL }}
          HOST_OPS_WEBHOOK_AUTH: ${{ secrets.HOST_OPS_WEBHOOK_AUTH }}
        run: |
          set -euo pipefail
          SSH() { ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$@"; }
          # Created once, never recreated (docker secrets are immutable). Values
          # travel via stdin only, never in the remote command line.
          if [ -z "${DISPATCHER_TOKEN:-}" ]; then
            echo "DISPATCHER_TOKEN secret is empty — set the production environment secret DISPATCHER_TOKEN (dispatcher Bearer)" >&2
            exit 1
          fi
          # $1=secret name, $2=value. Empty value -> 1-byte placeholder file that
          # the server trims to "not configured" (webhook off), so the stack
          # always deploys even before the webhook is set up.
          ensure_secret() {
            local name="$1" value="$2"
            if SSH "docker secret inspect ${name} >/dev/null 2>&1"; then
              echo "${name}: exists, leaving it (immutable)"
            elif [ -n "$value" ]; then
              printf '%s' "$value" | SSH "docker secret create ${name} - >/dev/null"
              echo "${name}: created"
            else
              printf '\n' | SSH "docker secret create ${name} - >/dev/null"
              echo "${name}: placeholder (empty) — webhook stays off"
            fi
          }
          ensure_secret host_ops_dispatcher_token "$DISPATCHER_TOKEN"
          if [ -z "${HOST_OPS_WEBHOOK_URL:-}" ] || [ -z "${HOST_OPS_WEBHOOK_AUTH:-}" ]; then
            echo "::warning::HOST_OPS_WEBHOOK_URL / HOST_OPS_WEBHOOK_AUTH not set in the production environment — webhook stays off. To enable later: set both secrets, then on the manager run 'docker stack rm host-ops' and 'docker secret rm host_ops_webhook_url host_ops_webhook_auth', and re-run deploy."
          fi
          ensure_secret host_ops_webhook_url "${HOST_OPS_WEBHOOK_URL:-}"
          ensure_secret host_ops_webhook_auth "${HOST_OPS_WEBHOOK_AUTH:-}"
      - name: pull image and deploy (start-first, rollback on failure)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          HOST_OPS_WEBHOOK_HEADER: ${{ vars.HOST_OPS_WEBHOOK_HEADER }}
          TRAEFIK_ENTRYPOINT: ${{ vars.TRAEFIK_ENTRYPOINT }}
          TRAEFIK_CERTRESOLVER: ${{ vars.TRAEFIK_CERTRESOLVER }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
        run: |
          set -euo pipefail
          SSH() { ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$@"; }
          # Optional login for private/rate-limited GHCR (token via stdin, never in remote command line).
          if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
            printf '%s' "$GHCR_PULL_TOKEN" | SSH "docker login ghcr.io -u '${GHCR_USER}' --password-stdin"
          fi
          # Dispatcher + webhook secrets were ensured by the previous step.
          SSH "cd '${DEPLOY_PATH}' && DEPLOY_PATH='${DEPLOY_PATH}' IMAGE_TAG='${IMAGE_TAG}' HOST_OPS_DOMAIN='${HOST_OPS_DOMAIN:-}' HOST_OPS_WEBHOOK_HEADER='${HOST_OPS_WEBHOOK_HEADER:-}' TRAEFIK_ENTRYPOINT='${TRAEFIK_ENTRYPOINT:-}' TRAEFIK_CERTRESOLVER='${TRAEFIK_CERTRESOLVER:-}' TRAEFIK_NETWORK='${TRAEFIK_NETWORK:-}' docker stack deploy -c stack.yml --with-registry-auth host-ops"
      - name: wait for host-ops_server to converge (timeout fails)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH() { ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$@"; }
          WANT="ghcr.io/moderras/pi-host-ops-server:${IMAGE_TAG}"
          for _ in $(seq 1 40); do
            STATE="$(SSH "docker service inspect host-ops_server --format '{{.UpdateStatus.State}}'" 2>/dev/null || true)"
            SPEC="$(SSH "docker service inspect host-ops_server --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'" 2>/dev/null || true)"
            # Swarm resolves to tag@sha256:..., so prefix-match instead of exact equality.
            RUNNING="$(SSH "docker service ps host-ops_server --filter desired-state=running --format '{{.Image}} {{.CurrentState}}'" 2>/dev/null | grep -c "^${WANT}\(@[^ ]*\)\? .*Running" || true)"
            RUNNING="${RUNNING:-0}"
            echo "update=${STATE} spec=${SPEC} running=${RUNNING}"
            case "${STATE}" in
              *rollback*|*paused*) echo "update failed: ${STATE}"; exit 1;;
            esac
            SPEC_OK=0
            case "${SPEC}" in
              "${WANT}"|"${WANT}"@*) SPEC_OK=1 ;;
            esac
            if { [ "${SPEC_OK}" -eq 1 ] || [ "${RUNNING}" -ge 1 ]; } && [ "${RUNNING}" -ge 1 ]; then
              echo CONVERGED
              exit 0
            fi
            sleep 15
          done
          echo "converge timeout"; exit 1
      - name: public health check https://domain/health (retried)
        run: |
          set -euo pipefail
          DOMAIN="${HOST_OPS_DOMAIN:-example.com}"
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://${DOMAIN}/health"; then
              echo; echo HEALTHY
              exit 0
            fi
            sleep 10
          done
          echo "health check failed"; exit 1
      - name: prune old images
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "docker image prune -f"

  binaries:
    name: build release binaries (before deploy approval)
    needs: [version, test]
    # Same gate as deploy: main repo master push only; PRs skip (binaries are
    # built in parallel with the image, before production approval blocks deploy).
    if: github.repository == 'ModerRAS/pi-host-ops-server' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}
      phase: build

  release:
    name: publish GitHub release (tag + upload, no rebuild)
    needs: [version, deploy]
    # Same gate as deploy: main repo master push only. The tag is created here
    # (after deploy success) at the deployed commit — a GITHUB_TOKEN tag push
    # would NOT retrigger workflows, hence the reusable-workflow call.
    # Artifacts come from the binaries job's phase=build call in this same run.
    if: github.repository == 'ModerRAS/pi-host-ops-server' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}
      phase: publish
